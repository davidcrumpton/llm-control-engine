name: Release

# Releases are cut from a tag, and only from a tag. `main` is free to run ahead
# of the newest tag; pushing to main builds and tests but never publishes.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Never publish two releases for the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets are built on an arm64 runner. pkg only needs to
          # execute the base Node build when it generates bytecode, so with
          # --no-bytecode (applied to every non-host target) one arm64 host can
          # patch an x86_64 base without Rosetta. That avoids depending on the
          # deprecated Intel macOS image, which no longer provisions.
          - os: macos-latest
            name: macos
            targets: node20-macos-arm64,node20-macos-x64
          - os: ubuntu-24.04
            name: linux-x64
            targets: node20-linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            targets: node20-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binaries
        env:
          PKG_TARGETS: ${{ matrix.targets }}
        run: npm run build:bin

      - name: Smoke test binaries
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            macOS) host_os=macos ;;
            Linux) host_os=linux ;;
            *) echo "::error::unsupported runner $RUNNER_OS"; exit 1 ;;
          esac
          host_arch=$(node -p 'process.arch')
          host="llmctrlx-${host_os}-${host_arch}"

          # The version is baked into the binary at build time, so a tag that
          # does not match package.json would publish a mislabelled release.
          expected="${GITHUB_REF_NAME#v}"
          got="$(./dist/$host version | awk '{print $2}')"
          if [ "${got#v}" != "$expected" ]; then
            echo "::error::binary reports ${got} but tag is ${GITHUB_REF_NAME} — bump package.json before tagging"
            exit 1
          fi

          # Bundled tools/plugins are pkg assets; if they were not embedded, the
          # release would ship a binary that cannot load them.
          ./dist/$host tools --list
          ./dist/$host plugins --list

          # Only the host binary can be executed here. Everything else is
          # cross-built, so verify its architecture instead of running it.
          for bin in dist/llmctrlx-*-*; do
            base=$(basename "$bin")
            [ "$base" = "$host" ] && continue
            case "$base" in
              *-x64) want='x86_64|x86-64' ;;
              *-arm64) want='arm64|aarch64' ;;
              *) echo "::error::unrecognised target name $base"; exit 1 ;;
            esac
            if ! file "$bin" | grep -Eq "$want"; then
              echo "::error::$base is not the expected architecture:"
              file "$bin"
              exit 1
            fi
            echo "arch ok: $base -> $(file -b "$bin" | cut -d, -f2)"
          done

      - name: Package tarballs
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          for bin in dist/llmctrlx-*-*; do
            plat=$(basename "$bin"); plat="${plat#llmctrlx-}"
            name="llmctrlx-${ver}-${plat}"
            mkdir -p "stage/${name}"
            cp "$bin" "stage/${name}/llmctrlx"
            cp -R tools plugins man "stage/${name}/"
            cp LICENSE README.md "stage/${name}/"
            tar -czf "${name}.tar.gz" -C stage "${name}"
            # The Homebrew formula is written against these checksums.
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            else
              shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
            fi
            cat "${name}.tar.gz.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  packages:
    name: deb + rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby (for fpm)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install fpm and system tools
        run: |
          gem install fpm
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build DEB and RPM packages
        run: npm run build:packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            *.deb
            *.rpm

  release:
    name: publish release
    # Publishing waits for every platform, so a release is never partial.
    needs: [binaries, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l assets

          tarballs=$(ls assets/*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          if [ "$tarballs" -ne 4 ]; then
            echo "::error::expected 4 platform tarballs, found ${tarballs}"
            exit 1
          fi

          # Re-running a tag re-uploads rather than failing on "already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
